name: China News Briefing
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-docx
      - name: Scrape China news
        continue-on-error: true
        run: python news_scraper.py > china_news_raw.json 2> scrape.log || true
      - name: Scrape diagnostics
        if: always()
        run: |
          echo "=== scrape.log (tail) ==="
          tail -n 30 scrape.log 2>/dev/null || true
          echo "=== raw bytes ==="
          wc -c china_news_raw.json 2>/dev/null || true
      - name: Generate Word doc with translations
        continue-on-error: true
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: python generate_docx.py china_news_raw.json China_News_Briefing.docx
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: china-briefing
          path: '*.docx'
      - name: Publish latest (API write, guard empty)
        env:
          PAT: ${{ secrets.PAT }}
        run: |
          python - <<'PY'
          import json, os, base64, sys, urllib.request
          tok = os.environ.get('PAT','')
          URL = 'https://api.github.com/repos/raoxufeng1103/daily-news-brief'
          raw = 'china_news_raw.json'
          try:
              d = json.load(open(raw, encoding='utf-8'))
              arts = d.get('articles') if isinstance(d, dict) else d
          except Exception as e:
              print('PARSE_ERROR', repr(e)); sys.exit(0)
          if not arts:
              print('EMPTY/INVALID -> keep previous china_news_latest.json'); sys.exit(0)
          H = {'Authorization': f'Bearer {tok}', 'Accept':'application/vnd.github+json', 'User-Agent':'p', 'Content-Type':'application/json'}
          try:
              cur = json.loads(urllib.request.urlopen(urllib.request.Request(f'{URL}/contents/china_news_latest.json', headers=H), timeout=30).read())
              sha = cur.get('sha')
          except Exception:
              sha = None
          content = open(raw, 'rb').read()
          b64 = base64.b64encode(content).decode()
          body = json.dumps({"message": f"Auto update {len(arts)} articles", "content": b64, "sha": sha}).encode()
          req = urllib.request.Request(f'{URL}/contents/china_news_latest.json', data=body, headers=H, method='PUT')
          r = urllib.request.urlopen(req, timeout=60)
          print('API PUT status', r.status, '| articles', len(arts))
          PY
